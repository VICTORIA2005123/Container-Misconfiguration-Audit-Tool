# Secure Hardened Docker Compose Configuration
version: '3.8'

services:
  web-app:
    image: nginx:1.25.5-alpine
    privileged: false
    networks:
      - secure-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    volumes:
      - app-data:/var/app/data:ro
    ports:
      - "127.0.0.1:8080:80"

networks:
  secure-network:
    driver: bridge

volumes:
  app-data:
