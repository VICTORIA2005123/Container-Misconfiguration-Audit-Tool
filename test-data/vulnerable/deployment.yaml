# Intentionally Vulnerable Kubernetes Manifest for Security Auditing Demonstration
# WARNING: FOR LOCAL SECURITY TESTING ONLY - DO NOT USE IN PRODUCTION

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-workload
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-service
  template:
    metadata:
      labels:
        app: vulnerable-service
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
      containers:
        - name: app-container
          image: node:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsUser: 0
            capabilities:
              add:
                - ALL
                - SYS_ADMIN
          env:
            - name: DATABASE_PASSWORD
              value: "DEMO_NOT_A_REAL_K8S_SECRET_XYZ99"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
