name: Container Misconfiguration Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  audit-and-test:
    name: Run Tests & Container Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: "latest"

      - name: Verify Docker and Trivy
        run: |
          docker --version
          trivy --version

      - name: Build Docker Image
        run: |
          docker build -t container-audit:ci .

      - name: Scan Docker Image with Container Audit
        run: |
          container-audit image container-audit:ci \
            --format terminal

      - name: Run Test Suite
        run: |
          pytest -v --cov=app

      - name: Scan Vulnerable Test Data
        run: |
          container-audit scan test-data/vulnerable \
            --format terminal || true

      - name: Verify Secure Test Data
        run: |
          container-audit scan test-data/secure \
            --format terminal \
            --fail-on HIGH

      - name: Generate Security Audit Reports
        if: always()
        run: |
          mkdir -p reports

          container-audit scan . \
            --format json \
            --output reports/security-report.json || true

          container-audit scan . \
            --format html \
            --output reports/security-report.html || true

          container-audit scan . \
            --format sarif \
            --output reports/security-report.sarif || true

      - name: Upload Security Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-audit-reports
          path: reports/

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/security-report.sarif
          category: container-misconfiguration-audit
